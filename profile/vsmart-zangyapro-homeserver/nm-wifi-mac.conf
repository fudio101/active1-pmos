# Server profile: keep the WiFi MAC that bootmac derives from the device serial
# (02:00:..., stable across reinstalls), so a DHCP reservation survives a fresh install.
# Overrides 50-random-mac.conf. NM's "stable" MAC hashes the machine-id, which changes on
# every install. "preserve" is used instead of "permanent" because ath10k reports a random
# permanent address on every boot.
# NM sees wlan0 before bootmac sets its MAC. With scan randomization on, NM changes the MAC
# to scan and then restores the address it first saw (ath10k's random one), not bootmac's.
# So scan randomization stays off and NM never touches the MAC at all.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=preserve
