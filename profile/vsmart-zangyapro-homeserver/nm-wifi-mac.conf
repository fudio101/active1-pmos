# Server profile: keep the WiFi MAC that bootmac derives from the device serial
# (02:00:..., stable across reinstalls), so a DHCP reservation survives a fresh install.
# Overrides wifi.cloned-mac-address=stable from 50-random-mac.conf. NM's "stable" MAC
# hashes the machine-id, which changes on every install. "preserve" is used instead of
# "permanent" because ath10k reports a random permanent address on every boot.
[connection]
wifi.cloned-mac-address=preserve
