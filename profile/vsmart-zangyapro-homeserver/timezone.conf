# Server profile: keep the system clock in Vietnam time (UTC+7) so logs read in local time.
# A tmpfiles rule instead of shipping /etc/localtime: pmbootstrap creates that symlink at
# install time, so a package-owned copy would clash with it. L+ re-points it on every boot.
L+ /etc/localtime - - - - ../usr/share/zoneinfo/Asia/Ho_Chi_Minh
